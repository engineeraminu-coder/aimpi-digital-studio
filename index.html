<!doctype html><html lang="en"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Aimpi Digital Studio — Premium Websites for Ambitious Businesses</title>
<meta name="description" content="A web development studio creating premium websites for hotels, restaurants, construction, real estate, fashion and more. Explore six live industry demonstrations."/>
<meta property="og:title" content="Aimpi Digital Studio — Premium Websites"/><meta property="og:type" content="website"/>
<meta property="og:description" content="Explore six live industry demonstrations and start your project."/>
<meta property="og:image" content="/images/og.jpg"/><meta name="theme-color" content="#0a0e1a"/>

<!-- Static forms so Netlify detects them at deploy time -->
<div hidden>
<form name="contact" netlify netlify-honeypot="bot"><input name="bot"/><input name="name"/><input name="email"/><input name="service"/><textarea name="message"></textarea></form>
<form name="hotel" netlify><input name="name"/><input name="email"/><input name="checkin"/><input name="checkout"/><input name="room"/><input name="guests"/></form>
<form name="restaurant" netlify><input name="name"/><input name="email"/><input name="date"/><input name="time"/><input name="guests"/></form>
<form name="construction" netlify><input name="name"/><input name="email"/><input name="type"/><input name="budget"/><textarea name="details"></textarea></form>
<form name="realestate" netlify><input name="name"/><input name="email"/><input name="property"/><textarea name="message"></textarea></form>
<form name="fashion" netlify><input name="name"/><input name="email"/><input name="product"/><input name="size"/></form>
<form name="cleaning" netlify><input name="name"/><input name="email"/><input name="service"/><input name="date"/><textarea name="details"></textarea></form>
</div>
<div id="root"></div><script type="module" src="/src/main.jsx"></script></body></html>
